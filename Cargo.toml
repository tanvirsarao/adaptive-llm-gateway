[package]
name = "adaptive-llm-gateway"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic, cost-aware LLM inference gateway for Rust"
license = "MIT"
repository = "https://github.com/tanvirsarao/adaptive-llm-gateway"
keywords = ["llm", "gateway", "ai", "rust"]
categories = ["api-bindings", "web-programming"]

[lib]
name = "adaptive_llm_gateway"
path = "src/lib.rs"

[[bin]]
name = "adaptive-llm-gateway"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"
required-features = ["cli"]

[features]
default = []
server = ["dep:axum", "dep:tokio", "dep:tracing-subscriber"]
openai-compatible = ["dep:reqwest"]
cli = ["dep:clap", "dep:tokio", "openai-compatible"]
redis-cache = ["dep:redis", "dep:tokio"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.8", optional = true, features = ["json"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net"] }
tracing-subscriber = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
